[application]

config_version = 3


[plex]

# Plex Server URL

url = http://SERVER:32400

# Plex Authentication Token

token = PLEX_TOKEN_HERE

# Plex Music library name that is being imported into

library = Music

[tidal]

enabled = false
allow_explicit = true
#
#
# Client_id and client_secret are obtained by registering an application
# in the tidal developers dashboard after signing in with your tidal account
# https://developer.tidal.com/dashboard  suggested tidal app name "ppi"
#
 
client_id =  CLIENT_ID_HERE
client_secret = CLIENT_SECRET_HERE


country_code = US
timeout = 20
# Pause between title-matching track detail lookups to reduce TIDAL API 429 responses.
hydration_delay_seconds = 0.25
user_token_file = cache/tidal_user_tokens.json
redirect_uri = http://127.0.0.1:8765/callback
authorization_timeout_seconds = 180


cache_enabled = true
cache_database = cache/tidal_search_cache.db
state_database = cache/tidal_state.db
cache_max_age_hours = 24

quality_preference = DOLBY_ATMOS,HIRES_LOSSLESS,LOSSLESS,HIGH,LOW


[lidarr]

# Enable Lidarr integration.
enabled = false

# Lidarr server URL.
url =  http://LIDARR_SERVER:8686

# Lidarr API key from Settings > General > Security.
api_key = LIDARR_API_KEY_HERE

remember_failed_searches = true
retry_search_after_days = 7
search_history_database = cache/lidarr_search_history.db


# HTTP timeout for Lidarr API calls.
timeout_seconds = 20

[xmplaylist]
base_url = https://xmplaylist.com
timeout_seconds = 20
user_agent = plex-playlist-importer/1.0

state_database = cache/xmplaylist_history.db
history_hours = 168
max_requests_per_run = 8
max_tracks_per_run = 100

[analytics]
enabled = true
history_csv = reports/match_analytics.csv
latest_json = reports/latest_run.json

[alias_intelligence]
track_usage = true
usage_database = cache/alias_usage.db
review_after_days = 90

[matching]

# Minimum score (0-100)

threshold = 85

# Number of worker threads

threads = 8

# Preferred recording type in decending order (comma-separated)
# handy when multiple track types exist for the same song (e.g. studio vs live)

preferred_versions = studio,remaster,remastered,stereo,album,single,live,acoustic,demo,alternate,instrumental,radio,extended,edit,mono
# Candidates containing any of these terms in title, album, or version are rejected.
# rejected_terms takes precedence over preferred_versions.
# Example: rejected_terms = karaoke,tribute
rejected_terms =

# Weighting

artist_weight = 0.25
album_artist_weight = 0.15
title_weight = 0.45
combined_weight = 0.15

min_title_score = 95
fallback_title_score = 80

[cache]

database = cache/plex_library.db
max_age_hours = 12

[playlist]
trim = 0


[reports]

directory = reports
match = playlist_report.csv
unmatched = unmatched.csv
lidarr = lidarr_unmatched_report.csv
include_file_paths = false

[artist_aliases]
enabled = true
file = resources/aliases.txt

[logging]

#
#  debug=true,  trace=false  -> inspect candidates and scores
#  debug=false, trace=true   -> inspect pipeline and timing
#
debug = false
trace = false

level = INFO

directory = logs

filename = playlist_import.log



