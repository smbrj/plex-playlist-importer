[application]

config_version = 1


[plex]

# Plex Server URL

url = http://192.168.1.12:32400

# Plex Authentication Token

token = PLEX-TOKEN-HERE

# Plex Music library name that is being imported into

library = Music


[lidarr]

# Enable Lidarr integration.
enabled = true

# Lidarr server URL.
url =  http://192.168.1.12:8686

# Lidarr API key from Settings > General > Security.
api_key = LIDARR_API_KEY_HERE

remember_failed_searches = true
retry_search_after_days = 7
search_history_database = cache/lidarr_search_history.db


# HTTP timeout for Lidarr API calls.
timeout_seconds = 60

[xmplaylist]
base_url = https://xmplaylist.com
timeout_seconds = 20
user_agent = plex-playlist-importer/1.0

state_database = cache/xmplaylist_history.db
history_hours = 168
max_requests_per_run = 8
max_tracks_per_run = 100

[analytics]
enabled = true
history_csv = reports/match_analytics.csv
latest_json = reports/latest_run.json

[alias_intelligence]
track_usage = true
usage_database = cache/alias_usage.db
review_after_days = 90

[matching]

# Minimum score (0-100)

threshold = 85

# Number of worker threads

threads = 8

# Preferred recording type in decending order (comma-separated)
# handy when multiple track types exist for the same song (e.g. studio vs live)

preferred_versions = studio,remaster,stereo,album,single,live,acoustic,demo,alternate,instrumental,radio,extended,edit,mono

# Weighting

artist_weight = 0.25
album_artist_weight = 0.15
title_weight = 0.45
combined_weight = 0.15

min_title_score = 95
fallback_title_score = 80

[cache]

enabled = true
database = cache/plex_library.db
refresh_on_start = false
max_age_hours = 12


[reports]

unmatched = unmatched.csv
output_path = reports/
include_file_paths = false

[artist_aliases]
enabled = true
file = resources/aliases.txt

[logging]

#
#  debug=true,  trace=false  -> inspect candidates and scores
#  debug=false, trace=true   -> inspect pipeline and timing
#
debug = false
trace = false

level = INFO

directory = logs

filename = playlist_import.log




[playlist]

# duplicate handling:
#
# skip
#

duplicates = skip

# preserve playlist order

preserve_order = true
