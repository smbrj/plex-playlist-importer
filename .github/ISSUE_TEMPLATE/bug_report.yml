name: Bug Report
description: Report a reproducible problem with Plex Playlist Importer (PPI).
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Plex Playlist Importer (PPI).

        Before submitting a bug report:

        - Verify the issue occurs with the current supported version of PPI.
        - Search existing Issues to avoid duplicates.
        - **Do not include passwords, API keys, tokens, or other sensitive information.**

  - type: input
    id: version
    attributes:
      label: PPI Version
      description: Version of PPI being used.
      placeholder: 0.1.0b1
    validations:
      required: true

  - type: dropdown
    id: operating_system
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - Unraid
        - Other
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: 3.11.15
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide enough information for someone else to reproduce the issue.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant log messages.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that may help diagnose the problem.