; XMPlaylist user station preferences.
; config.ini remains reserved for system/application configuration.
;
; playlist = default uses: Ch <channel> - <XMPlaylist station name>
; Valid modes: create, update, replace, sync
; max_tracks may be blank for unlimited-within-window behavior.

[50s_gold]
